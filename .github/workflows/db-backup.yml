name: Database backup

# Daily logical backup of the Supabase Postgres database.
# Supabase's free plan has no automatic backups, so this runs pg_dump on a
# schedule and stores each dump as a private, compressed GitHub artifact
# (kept out of the git history so user health data is never committed).
#
# Connection details are passed as individual libpq env vars so the password
# can contain any character without URL-encoding. Only the password is secret;
# host / user / db are not sensitive.

on:
  schedule:
    # 07:00 UTC daily (~2-3am US Eastern). Adjust if you like.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you run a backup on demand from the Actions tab

env:
  PGHOST: aws-1-us-east-1.pooler.supabase.com
  PGPORT: "5432"
  PGUSER: postgres.iqbmtnueioveaebuphwh
  PGDATABASE: postgres
  PGSSLMODE: require

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump database
        env:
          # Set in GitHub → Settings → Secrets and variables → Actions.
          # This is ONLY the database password, nothing else.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set."
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%d_%H%M%SZ)"
          echo "FILE=muscleguard-backup-${STAMP}.sql.gz" >> "$GITHUB_ENV"
          # pg_dump 17 (matches the Supabase server) via the official image.
          docker run --rm -i \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE -e PGPASSWORD \
            postgres:17-alpine \
            pg_dump --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > "muscleguard-backup-${STAMP}.sql.gz"
          echo "Backup size:"; ls -lh "muscleguard-backup-${STAMP}.sql.gz"
          # Sanity check: a real dump is more than a few bytes.
          if [ "$(stat -c%s "muscleguard-backup-${STAMP}.sql.gz")" -lt 200 ]; then
            echo "::error::Backup looks empty — check the DB password / connection."
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90 # free-plan max; ~90 daily backups on hand
          if-no-files-found: error
